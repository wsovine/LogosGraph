[project]
name = "logosgraph"
version = "0.1.0"
description = "Bible Graph Database - Neo4j graph of the original 73-book Bible with cross-references"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=5.0",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "tqdm>=4.65",
    "usfm-grammar>=3.0",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0", "pandas>=2.0", "pyvis>=0.3"]
dev = ["pytest>=7.0", "black>=23.0", "ruff>=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
